name: Privacy Blur – build

on:
  push:
    branches: [main]
    paths: ["privacy-blur/**", ".github/workflows/privacy-blur.yml"]
    tags: ["privacy-blur-v*"]
  pull_request:
    paths: ["privacy-blur/**", ".github/workflows/privacy-blur.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: privacy-blur

jobs:
  test:
    name: Core tests + frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: privacy-blur }
      - run: cargo test -p privacy-core
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: privacy-blur/package-lock.json }
      - run: npm ci
      - run: npm run build

  windows:
    name: Windows installer + standalone exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: privacy-blur }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: privacy-blur/package-lock.json }
      - run: npm ci
      - name: Build (NSIS installer + release exe)
        run: npx tauri build
      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe out/
          Copy-Item target/release/privacy-blur.exe out/PrivacyBlur-portable.exe
          Get-ChildItem out/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Append -Encoding ascii out/SHA256SUMS.txt
          }
          Get-Content out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: privacy-blur-windows
          path: privacy-blur/out/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/privacy-blur-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: privacy-blur-windows, path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
