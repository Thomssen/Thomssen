<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Thomsen Shield</title>

    <!--
      Inter is bundled locally via @fontsource-variable/inter (imported in
      src/main.tsx), so the app renders correctly offline with no external
      requests on startup.
    -->
    <style>
      /* Paint the window background before any CSS loads - no white flash. */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #050607;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
