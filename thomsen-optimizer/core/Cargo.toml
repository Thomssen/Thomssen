[package]
name = "thomsen-optimizer-core"
version = "1.0.0"
description = "Platform-independent logic for Thomsen Optimizer (analysis, restore journal, cleaner, game detection, FPS statistics)."
authors = ["Thomsen Software"]
edition = "2021"
rust-version = "1.81"
license = "UNLICENSED"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.33"
log = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Power",
] }

[dev-dependencies]
tempfile = "3"
